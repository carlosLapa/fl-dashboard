cors.origins=${CORS_ORIGINS:https://ferreiralapa-dashboard.pt}

security.issuer-uri=${ISSUER_URI:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Other production settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Logging for production (reduce verbosity)
logging.level.com.fl.dashboard=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
# application.properties (loaded in every profile) leaves these at DEBUG for local dev; every STOMP
# heartbeat/subscribe from every connected client was being logged at DEBUG in prod as a result.
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN

# Slack Integration Configuration
slack.webhook-url=${SLACK_WEBHOOK:}
slack.enabled=${SLACK_ENABLED:true}
slack.default-channel=${SLACK_DEFAULT_CHANNEL:#fl-dashboard-notificacoes}
slack.notification-types=${SLACK_NOTIFICATION_TYPES:TAREFA_ATRIBUIDA,TAREFA_STATUS_ALTERADO,PROJETO_CONCLUIDO,TAREFA_CONCLUIDA}