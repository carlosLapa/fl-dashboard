spring.application.name=dashboard

spring.profiles.active=dev
spring.jpa.open-in-view=false

# Enable SQL logging for testing
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# Valores de teste! Quando for colocada online, temos que alterar
security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}

security.jwt.duration=${JWT_DURATION:7200}

security.issuer-uri=${ISSUER_URI:}

cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Slack Webhook URL for notifications
slack.webhook-url=${SLACK_WEBHOOK:}
slack.enabled=${SLACK_ENABLED:true}
slack.default-channel=${SLACK_DEFAULT_CHANNEL:#fl-dashboard-notificacoes}
slack.notification-types=${SLACK_NOTIFICATION_TYPES:TAREFA_ATRIBUIDA,TAREFA_STATUS_ALTERADO,PROJETO_CONCLUIDO,TAREFA_CONCLUIDA}


# Mattermost incoming-webhook notifications (Tarefa/Projeto changes posted to a team channel).
# Off unless explicitly enabled. The webhook URL is a secret — set it only via environment variable.
mattermost.enabled=${MATTERMOST_ENABLED:false}
mattermost.webhook-url=${MATTERMOST_WEBHOOK_URL:}
mattermost.app-url=${APP_URL:http://localhost:3000}
mattermost.username=${MATTERMOST_USERNAME:FL Dashboard}
# ChatEventType names; empty = all. *_EDITADA/*_EDITADO are left out by default (they fire on every save).
mattermost.notification-types=${MATTERMOST_NOTIFICATION_TYPES:TAREFA_CRIADA,TAREFA_COLABORADORES_ALTERADOS,TAREFA_PRAZO_PRORROGADO,TAREFA_PRAZO_ALTERADO,TAREFA_STATUS_ALTERADO,TAREFA_CONCLUIDA,TAREFA_REMOVIDA,TAREFA_RECORRENTE_CRIADA,PROJETO_CRIADO,PROJETO_COLABORADORES_ALTERADOS,PROJETO_STATUS_ALTERADO,PROJETO_CONCLUIDO,PROJETO_PRAZO_PRORROGADO,PROJETO_PRAZO_ALTERADO,PROJETO_REMOVIDO}
